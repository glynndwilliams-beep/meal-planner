<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Planner</title>
  <meta name="description" content="Plan weekly meals, store scanned recipes and build a shared shopping list.">
  <meta name="theme-color" content="#2f7d4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16241b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="title">Meal plan</h1>
      <div id="topbar-actions"></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Sections">
      <button data-tab="plan" class="active"><span class="ico" aria-hidden="true">📅</span>Plan</button>
      <button data-tab="recipes"><span class="ico" aria-hidden="true">📖</span>Recipes</button>
      <button data-tab="shopping"><span class="ico" aria-hidden="true">🛒</span>Shopping<span class="badge" id="shop-badge" hidden></span></button>
      <button data-tab="settings"><span class="ico" aria-hidden="true">⚙️</span>Settings</button>
    </nav>
  </div>

  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
